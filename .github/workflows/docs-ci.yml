name: DIP Docs Quality CI

on:
  pull_request:
    branches:
      - main
      - master
      - "development/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Documentation, Links, OpenAPI & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Validate Markdown, links, OpenAPI, Mermaid, manifest & secrets
        run: npm run docs:validate

      - name: Run unit, contract, and security test suites
        run: npm test

      - name: Build documentation site (preview verification only)
        run: npm run build
